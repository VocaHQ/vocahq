<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" role="img" aria-labelledby="title desc">
  <title id="title">From idea to pull request</title>
  <desc id="desc">A code window moves through review to a merged contribution.</desc>
  <style>
    :root { --paper: #fffdf7; --deep-paper: #ebe5d8; --ink: #14231c; --muted: #58625c; --teal: #0f6b57; --dark-teal: #0b493d; --mint: #cfe9dc; --yellow: #e8c965; --red: #e77b68; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .paper { fill: var(--paper); }
    .deep-paper { fill: var(--deep-paper); }
    .mint { fill: var(--mint); }
    .teal { fill: var(--teal); }
    .dark-teal { fill: var(--dark-teal); }
    .yellow { fill: var(--yellow); }
    .red { fill: var(--red); }
    .stroke-ink { stroke: var(--ink); }
    .stroke-teal { stroke: var(--teal); }
    .stroke-line { stroke: #d5d0c4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .display { font-family: "Avenir Next", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif; }
    .float { animation: float 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float-delay { animation-delay: -2.1s; }
    .dash { animation: dash 3.2s linear infinite; }
    .blink { animation: blink 1.1s steps(2, end) infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .float, .dash, .blink { animation: none; }
    }
  </style>

  <path d="M84 419 C176 360 224 385 301 355 S432 290 573 332" fill="none" stroke="#0f6b57" stroke-width="3" stroke-dasharray="8 12" class="dash" opacity=".8"/>
  <circle cx="302" cy="355" r="8" class="paper stroke-teal" stroke-width="3"/>
  <circle cx="302" cy="355" r="3" class="teal"/>

  <g class="float">
    <rect x="74" y="92" width="302" height="214" rx="12" class="paper stroke-ink" stroke-width="3"/>
    <path d="M74 134h302" class="stroke-line" stroke-width="2"/>
    <circle cx="96" cy="113" r="6" class="red"/>
    <circle cx="116" cy="113" r="6" class="yellow"/>
    <circle cx="136" cy="113" r="6" class="teal"/>
    <text x="160" y="118" class="mono muted" font-size="14">idea / improve.md</text>
    <text x="99" y="171" class="mono teal" font-size="15">+ make the small thing</text>
    <text x="99" y="198" class="mono teal" font-size="15">+ easier to use</text>
    <text x="99" y="244" class="mono muted" font-size="13">git diff --stat</text>
    <rect x="99" y="263" width="102" height="5" rx="2.5" class="mint"/>
    <rect x="208" y="263" width="56" height="5" rx="2.5" class="deep-paper"/>
    <rect x="274" y="263" width="26" height="5" rx="2.5" class="teal"/>
  </g>

  <g class="float float-delay">
    <rect x="418" y="74" width="192" height="104" rx="10" class="mint stroke-ink" stroke-width="3" transform="rotate(5 514 126)"/>
    <text x="446" y="112" class="mono dark-teal" font-size="12" transform="rotate(5 446 112)">PULL REQUEST</text>
    <text x="446" y="139" class="display ink" font-size="22" font-weight="800" transform="rotate(5 446 139)">ready for review</text>
    <circle cx="573" cy="119" r="12" class="teal"/>
    <path d="m567 119 5 5 9-11" fill="none" stroke="#fffdf7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(5 573 119)"/>
  </g>

  <g class="float" style="animation-delay: -1s">
    <rect x="440" y="280" width="184" height="100" rx="10" class="dark-teal stroke-ink" stroke-width="3" transform="rotate(-4 532 330)"/>
    <circle cx="468" cy="316" r="12" class="yellow"/>
    <path d="m462 316 5 5 9-11" fill="none" stroke="#0b493d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-4 468 316)"/>
    <text x="493" y="319" class="mono mint" font-size="12" transform="rotate(-4 493 319)">MERGED</text>
    <text x="464" y="351" class="display paper" font-size="20" font-weight="800" transform="rotate(-4 464 351)">ship the good idea</text>
  </g>

  <g transform="translate(28 366) rotate(-7)">
    <rect width="138" height="64" rx="8" class="red"/>
    <text x="18" y="27" class="mono paper" font-size="11" font-weight="700">OPEN SOURCE</text>
    <text x="18" y="46" class="body paper" font-size="11">built in public</text>
  </g>

  <g class="blink">
    <rect x="346" y="345" width="3" height="22" rx="1.5" class="teal"/>
  </g>
</svg>
