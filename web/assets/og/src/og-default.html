<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>VocaHQ social card</title>
<style>
:root {
  --paper: #f4f1e8;
  --ink: #14231c;
  --muted: #58625c;
  --teal: #0f6b57;
  --mint: #cfe9dc;
  --display: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* { box-sizing: border-box; }

html,
body {
  width: 1200px;
  height: 630px;
  margin: 0;
  overflow: hidden;
}

body {
  color: var(--ink);
  background: var(--paper) url("../../brand/paper-dots.svg") repeat;
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
}

.frame {
  display: grid;
  grid-template-rows: 58px 1fr;
  width: 100%;
  height: 100%;
  padding: 34px 42px 40px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-family: var(--display);
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -0.055em;
}

.brand img {
  width: 38px;
  height: 38px;
}

.header-note {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.header-note::before {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 4px var(--mint);
  content: "";
}

.layout {
  display: grid;
  grid-template-columns: 1fr 510px;
  gap: 54px;
  align-items: center;
}

.copy {
  padding-left: 24px;
}

.kicker {
  margin: 0 0 20px;
  color: var(--teal);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

h1 {
  max-width: 500px;
  margin: 0;
  font-family: var(--display);
  font-size: 84px;
  font-weight: 800;
  letter-spacing: -0.075em;
  line-height: 0.88;
}

h1 em {
  color: var(--teal);
  font-style: normal;
}

.lede {
  max-width: 470px;
  margin: 27px 0 0;
  color: var(--muted);
  font-size: 21px;
  line-height: 1.45;
}

.promises {
  display: flex;
  gap: 16px;
  margin: 28px 0 0;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.promises span::before {
  margin-right: 7px;
  color: var(--teal);
  content: "·";
}

.ecosystem-art {
  width: 510px;
  margin: 0;
}

.ecosystem-art img {
  display: block;
  width: 100%;
  height: auto;
}
</style>
</head>
<body>
  <main class="frame">
    <header class="header">
      <div class="brand">
        <img src="../../brand/voca-app-icon.svg" width="38" height="38" alt="">
        <span>VocaHQ</span>
      </div>
      <div class="header-note">Private speech-to-text, in public</div>
    </header>

    <div class="layout">
      <section class="copy">
        <p class="kicker">One family. Every surface.</p>
        <h1>one voice.<br><em>every<br>machine.</em></h1>
        <p class="lede">Free and open-source speech-to-text across the machines you own.</p>
        <p class="promises"><span>on-device first</span><span>gateway optional</span><span>open source</span></p>
      </section>

      <figure class="ecosystem-art">
        <img src="../../illustrations/voca-ecosystem-map.png" width="1300" height="1209" alt="Voca ecosystem map connecting VocaPhone with VocaLinux, VocaMac, VocaWin, and VocaGateway.">
      </figure>
    </div>
  </main>
</body>
</html>
