name: Site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs (and main) validate the static site without publishing.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site files
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/styles.css
          test -f web/script.js
          test -f web/CNAME
          test -f web/robots.txt
          test -f web/sitemap.xml
          test -f web/assets/brand/vocaphone/vocaphone-logo.svg
          test -f web/assets/brand/vocaphone/vocaphone-logo-512.png
          test -f web/assets/brand/vocaphone/vocaphone-play-store-512.png
          test -f web/assets/og/og-default.png
          test -f web/assets/icons/linux.svg
          # Relative asset refs used by the page must resolve under web/
          grep -q 'assets/brand/vocaphone/vocaphone-play-store-512.png' web/index.html
          grep -q 'assets/brand/vocaphone/vocaphone-logo-512.png' web/index.html
          grep -q 'assets/og/og-default.png' web/index.html
          grep -q 'application/ld+json' web/index.html
          grep -q 'assets/icons/' web/index.html
          echo "web/ looks deployable"

  # Only publish after merge to main (or manual dispatch on main).
  deploy:
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
